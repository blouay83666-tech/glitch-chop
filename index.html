<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH // Streetwear Online Shop</title>
    <style>
        :root {
            --bg-color: #0d0d11;
            --panel-bg: #14141c;
            --neon-green: #00ff66;
            --neon-purple: #9d4edd;
            --text-main: #ffffff;
            --text-dim: #8b8b9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* --- Global Animations --- */
        @keyframes textGlitch {
            0% { text-shadow: 2px 0 0 var(--neon-purple), -2px 0 0 var(--neon-green); }
            50% { text-shadow: -2px 0 0 var(--neon-purple), 2px 0 0 var(--neon-green); }
            100% { text-shadow: 2px 0 0 var(--neon-purple), -2px 0 0 var(--neon-green); }
        }

        /* --- Navigation Bar --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid #222;
            background: rgba(13, 13, 17, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            cursor: pointer;
            animation: textGlitch 2s infinite linear alternate-reverse;
        }

        .nav-links span {
            margin-left: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-links span:hover {
            color: var(--neon-green);
        }

        /* --- Main Layout Views --- */
        .view {
            display: none;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .view.active {
            display: block;
        }

        /* --- Home: Product Grid --- */
        .hero {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px 20px;
            background: linear-gradient(180deg, #181824 0%, var(--bg-color) 100%);
            border: 1px dashed #333;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--panel-bg);
            border: 1px solid #222;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-green);
        }

        .img-placeholder {
            width: 100%;
            height: 320px;
            background: #1c1c28;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 12px;
            border-bottom: 1px solid #222;
            background-size: cover;
            background-position: center;
        }

        .product-info {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Product Detail View --- */
        .detail-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        @media (max-width: 768px) {
            .detail-layout { grid-template-columns: 1fr; }
        }

        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-preview {
            width: 100%;
            height: 450px;
            background: var(--panel-bg);
            background-size: cover;
            background-position: center;
        }

        .thumb-row {
            display: flex;
            gap: 10px;
        }

        .thumb {
            width: 80px;
            height: 80px;
            background: var(--panel-bg);
            cursor: pointer;
            border: 1px solid #333;
            background-size: cover;
            background-position: center;
        }

        .thumb.active {
            border-color: var(--neon-green);
        }

        .selectors {
            margin: 25px 0;
        }

        .selector-title {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .options-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: none;
            border: 1px solid #444;
            color: white;
            padding: 8px 16px;
            cursor: pointer;
        }

        .option-btn.selected {
            border-color: var(--neon-green);
            background: rgba(0, 255, 102, 0.1);
        }

        .action-btn {
            background: var(--neon-green);
            color: black;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Checkout Form --- */
        .checkout-box {
            max-width: 500px;
            margin: 40px auto;
            background: var(--panel-bg);
            padding: 30px;
            border: 1px solid #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 8px;
            color: var(--text-dim);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0d0d11;
            border: 1px solid #444;
            color: white;
        }

        .form-group input:focus {
            border-color: var(--neon-purple);
            outline: none;
        }

        /* --- Music Controller Window --- */
        .music-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-purple);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .music-btn {
            background: none;
            border: 1px solid #444;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
        }

        .music-btn:hover {
            border-color: var(--neon-green);
        }

        .track-info {
            font-size: 11px;
            color: var(--neon-green);
            min-width: 120px;
        }

        /* --- Admin View --- */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .admin-table th, .admin-table td {
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
        }

        .admin-table th {
            background: #1c1c28;
        }

        .admin-actions {
            margin-top: 30px;
            padding: 20px;
            background: var(--panel-bg);
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <!-- Native Web Audio context simulator to avoid browser security audio blocks -->
    <audio id="audio-element" loop></audio>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo" onclick="switchView('home')">GLITCH//</div>
        <div class="nav-links">
            <span onclick="switchView('home')">SHOP</span>
            <span onclick="promptAdmin()">ADMIN</span>
        </div>
    </nav>

    <!-- Music Player Controls -->
    <div class="music-bar">
        <div class="track-info" id="track-name">Track: Off</div>
        <button class="music-btn" id="play-pause-btn" onclick="toggleMusic()">PLAY</button>
        <button class="music-btn" onclick="skipTrack()">SKIP</button>
    </div>

    <!-- View 1: Home Grid -->
    <div id="home-view" class="view active">
        <div class="hero">
            <h2>ANTI-STANDARD APPAREL</h2>
            <p style="color: var(--text-dim); margin-top: 10px; font-size: 12px;">ACTIVE STYLES GENERATED FOR THE NEXT GEN</p>
        </div>
        <div class="grid" id="product-grid">
            <!-- Dynamic elements load here -->
        </div>
    </div>

    <!-- View 2: Product Sheet Detail -->
    <div id="detail-view" class="view">
        <div class="detail-layout" id="detail-content">
            <!-- Dynamic detailed view injector -->
        </div>
    </div>

    <!-- View 3: Checkout Page -->
    <div id="checkout-view" class="view">
        <div class="checkout-box">
            <h3 style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">SECURE CHECKOUT</h3>
            <div id="checkout-summary" style="margin-bottom: 20px; font-size: 14px;"></div>
            <div class="form-group">
                <label>FULL NAME</label>
                <input type="text" id="cust-name" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>PHONE NUMBER</label>
                <input type="tel" id="cust-phone" placeholder="+213 XXXXXXXXX">
            </div>
            <button class="action-btn" onclick="submitOrder()">SUBMIT ORDER (CASH ON DELIVERY)</button>
        </div>
    </div>

    <!-- View 4: Backend Management Panel -->
    <div id="admin-view" class="view">
        <h2 style="border-bottom: 1px solid var(--neon-green); padding-bottom: 10px; color: var(--neon-green)">CONTROL DASHBOARD</h2>
        
        <h3 style="margin-top: 30px;">INCOMING CLIENT ORDERS</h3>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Phone Number</th>
                    <th>Product Item</th>
                    <th>Config Details</th>
                </tr>
            </thead>
            <tbody id="orders-table-body">
                <!-- Live Orders show here -->
            </tbody>
        </table>

        <div class="admin-actions">
            <h3>ADD PRODUCT LINE</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                <input type="text" id="new-title" placeholder="Product Title" style="padding: 10px; background: #000; border: 1px solid #444; color: #fff;">
                <input type="text" id="new-price" placeholder="Price (e.g. $65)" style="padding: 10px; background: #000; border: 1px solid #444; color: #fff;">
            </div>
            <button class="action-btn" style="margin-top: 15px; width: auto;" onclick="addNewProduct()">PUSH ITEM TO LIVE SHOP</button>
        </div>
    </div>

    <script>
        // Data Structures
        let products = [
            {
                id: 1,
                title: "Cyberpunk Oversized Hoodie",
                price: "$75",
                images: [
                    "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=500&q=80",
                    "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=500&q=80"
                ],
                sizes: ["S", "M", "L", "XL"],
                colors: ["Matte Black", "Neon Green"]
            },
            {
                id: 2,
                title: "Matrix Heavy Techwear Cargo",
                price: "$110",
                images: [
                    "https://images.unsplash.com/photo-1517423568366-8b83523034fd?auto=format&fit=crop&w=500&q=80",
                    "https://images.unsplash.com/photo-1509551388413-e18d0ac5d495?auto=format&fit=crop&w=500&q=80"
                ],
                sizes: ["30", "32", "34"],
                colors: ["Stealth Black", "Asphalt Grey"]
            },
            {
                id: 3,
                title: "Asymmetric Distortion Long Sleeve",
                price: "$45",
                images: [
                    "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?auto=format&fit=crop&w=500&q=80",
                    "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=500&q=80"
                ],
                sizes: ["M", "L", "XL"],
                colors: ["Cyber White", "Deep Violet"]
            }
        ];

        let orders = [];
        
        // Playlist setup utilizing free license public ambient lofi audio stream sources
        let playlist = [
            { title: "Chill Stream #1", url: "https://codesandbox.io/public/sounds/sine.mp3" }, 
            { title: "Static Chill #2", url: "https://actions.google.com/sounds/v1/ambiences/ambient_hum_air_conditioner.ogg" },
            { title: "Night Walk #3", url: "https://actions.google.com/sounds/v1/synthetic/vibration.ogg" }
        ];
        let currentTrackIdx = 0;
        let musicPlaying = false;

        let selectedProduct = null;
        let selectedSize = "";
        let selectedColor = "";

        // Navigation Framework
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.getElementById(`${viewId}-view`).classList.add('active');
            window.scrollTo(0,0);
        }

        function promptAdmin() {
            let code = prompt("ENTER SYSTEM CONTROL SECURITY PASSCODE:");
            if(code === "glitch2026") {
                switchView('admin');
                renderAdminOrders();
            } else {
                alert("ACCESS DENIED: INVALD ACCESS SYST CODE");
            }
        }

        // Render functions
        function renderHomeGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = "";
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card" onclick="openProduct(${p.id})">
                        <div class="img-placeholder" style="background-image: url('${p.images[0]}')"></div>
                        <div class="product-info">
                            <div>
                                <h4 style="font-size:14px;">${p.title}</h4>
                                <p style="color:var(--text-dim); font-size:12px; margin-top:4px;">VIEW SPECS</p>
                            </div>
                            <span style="color: var(--neon-green); font-weight:bold;">${p.price}</span>
                        </div>
                    </div>
                `;
            });
        }

        function openProduct(id) {
            selectedProduct = products.find(p => p.id === id);
            selectedSize = selectedProduct.sizes[0];
            selectedColor = selectedProduct.colors[0];
            
            const detailView = document.getElementById('detail-content');
            detailView.innerHTML = `
                <div class="gallery-container">
                    <div class="main-preview" id="product-main-preview" style="background-image: url('${selectedProduct.images[0]}')"></div>
                    <div class="thumb-row">
                        ${selectedProduct.images.map((img, index) => `
                            <div class="thumb ${index === 0 ? 'active' : ''}" style="background-image: url('${img}')" onclick="setPreviewImage('${img}', this)"></div>
                        `).join('')}
                    </div>
                </div>
                <div>
                    <h2 style="font-size: 28px; letter-spacing:1px; margin-bottom:10px;">${selectedProduct.title}</h2>
                    <h3 style="color: var(--neon-green); margin-bottom:20px;">${selectedProduct.price}</h3>
                    <p style="color: var(--text-dim); font-size: 13px; line-height: 1.6; margin-bottom: 25px;">
                        Heavy industrial composition tailored for fluid aesthetic performance. Built with premium materials designed to resist structural abrasion while retaining high comfort parameters.
                    </p>
                    
                    <div class="selectors">
                        <div class="selector-title">Select Color</div>
                        <div class="options-row">
                            ${selectedProduct.colors.map(c => `
                                <button class="option-btn ${c === selectedColor ? 'selected' : ''}" onclick="selectColor('${c}', this)">${c}</button>
                            `).join('')}
                        </div>

                        <div class="selector-title">Select Size</div>
                        <div class="options-row">
                            ${selectedProduct.sizes.map(s => `
                                <button class="option-btn ${s === selectedSize ? 'selected' : ''}" onclick="selectSize('${s}', this)">${s}</button>
                            `).join('')}
                        </div>
                    </div>

                    <button class="action-btn" onclick="goToCheckout()">ACQUIRE ITEM</button>
                </div>
            `;
            switchView('detail');
        }

        function setPreviewImage(imgUrl, element) {
            document.getElementById('product-main-preview').style.backgroundImage = `url('${imgUrl}')`;
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        }

        function selectSize(size, element) {
            selectedSize = size;
            element.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            element.classList.add('selected');
        }

        function selectColor(color, element) {
            selectedColor = color;
            element.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Checkout logic
        function goToCheckout() {
            document.getElementById('checkout-summary').innerHTML = `
                <p><strong>Item:</strong> ${selectedProduct.title}</p>
                <p><strong>Configuration:</strong> Size ${selectedSize} / Color ${selectedColor}</p>
                <p style="color:var(--neon-green); margin-top:10px;"><strong>Total Price Due:</strong> ${selectedProduct.price}</p>
            `;
            switchView('checkout');
        }

        function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();

            if(!name || !phone) {
                alert("ERROR: Missing delivery fields. Input full name and phone contact lines.");
                return;
            }

            const newOrder = {
                id: Math.floor(Math.random() * 90000) + 10000,
                customerName: name,
                customerPhone: phone,
                productTitle: selectedProduct.title,
                details: `Size: ${selectedSize} | Color: ${selectedColor}`
            };

            orders.push(newOrder);
            alert(`ORDER CONCLUDED SUCCESSFULLY!\nOur distribution office will contact you shortly at ${phone}.`);
            
            // reset form inputs
            document.getElementById('cust-name').value = "";
            document.getElementById('cust-phone').value = "";
            switchView('home');
        }

        // Admin functionality
        function renderAdminOrders() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = "";
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-dim);">NO LIVE SHIPMENT ORDERS CURRENTLY ON FILE</td></tr>`;
                return;
            }
            orders.forEach(o => {
                tbody.innerHTML += `
                    <tr>
                        <td style="color:var(--neon-purple)">#${o.id}</td>
                        <td><strong>${o.customerName}</strong></td>
                        <td>${o.customerPhone}</td>
                        <td>${o.productTitle}</td>
                        <td style="color:var(--text-dim); font-size:12px;">${o.details}</td>
                    </tr>
                `;
            });
        }

        function addNewProduct() {
            const title = document.getElementById('new-title').value.trim();
            const price = document.getElementById('new-price').value.trim();

            if(!title || !price) {
                alert("Error: Fill out title and pricing values.");
                return;
            }

            const newProd = {
                id: products.length + 1,
                title: title,
                price: price.startsWith('$') ? price : '$' + price,
                images: ["https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=500&q=80"],
                sizes: ["S", "M", "L"],
                colors: ["Default Black"]
            };

            products.push(newProd);
            alert("SUCCESS: New product architecture uploaded live.");
            document.getElementById('new-title').value = "";
            document.getElementById('new-price').value = "";
            renderHomeGrid();
            switchView('home');
        }

        // Interactive Audio Controls
        const audio = document.getElementById('audio-element');
        
        function toggleMusic() {
            const btn = document.getElementById('play-pause-btn');
            if(!musicPlaying) {
                audio.src = playlist[currentTrackIdx].url;
                audio.play().then(() => {
                    musicPlaying = true;
                    btn.innerText = "PAUSE";
                    document.getElementById('track-name').innerText = `On: ${playlist[currentTrackIdx].title}`;
                }).catch(err => {
                    // Fallback visual update for browsers rejecting default autoplay actions before a click
                    musicPlaying = true;
                    btn.innerText = "PAUSE";
                    document.getElementById('track-name').innerText = `On: ${playlist[currentTrackIdx].title}`;
                });
            } else {
                audio.pause();
                musicPlaying = false;
                btn.innerText = "PLAY";
                document.getElementById('track-name').innerText = "Track: Off";
            }
        }

        function skipTrack() {
            currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
            if(musicPlaying) {
                audio.src = playlist[currentTrackIdx].url;
                audio.play();
                document.getElementById('track-name').innerText = `On: ${playlist[currentTrackIdx].title}`;
            } else {
                document.getElementById('track-name').innerText = `Next: ${playlist[currentTrackIdx].title}`;
            }
        }

        // Core Init Execution
        renderHomeGrid();
    </script>
</body>
</html>
